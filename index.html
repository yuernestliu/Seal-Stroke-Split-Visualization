<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="小篆字形、笔画拆解、字源故事与字间联系的实验页面。" />
  <title>小篆实验</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./src/relations-panel.css" />
</head>
<body>
  <a href="#workspace" class="skip-link">跳到字形</a>
  <div class="page-shell">
    <aside class="utility-rail" aria-label="选择字形">
      <button id="openCatalog" type="button" class="utility-button">字库</button>
      <button id="randomGlyph" type="button" class="utility-button" aria-label="偶遇一个字">偶遇</button>
    </aside>
    <main>
      <section class="explorer" id="workspace" aria-label="字形与字源故事">
        <section class="writing-panel" aria-labelledby="writingTitle">
          <h1 class="panel-title" id="writingTitle">字形</h1>
          <div class="glyph-stage" id="glyphStage">
            <div class="stage-art"><img id="glyphImage" alt="" hidden /><div class="vector-stage" id="glyphVector"></div><div class="seal-font-stage" id="fontGlyph" hidden></div></div>
            <p class="sr-only" id="imageCaption" aria-live="polite"></p>
          </div>
          <button class="split-button" id="splitGlyph" type="button" aria-expanded="false" aria-controls="splitStrokes">拆笔 <span aria-hidden="true">↓</span></button>
          <div id="splitStrokes" class="split-strokes" aria-label="拆开的独立笔画" hidden></div>
        </section>
        <article class="story-panel" id="story" aria-labelledby="storyTitle">
          <h2 class="panel-title" id="storyTitle">字源故事</h2>
          <div class="story-identity"><h3 id="glyphTitle">安</h3><div><span class="story-type" id="formationType"></span><p id="glyphSource"></p></div></div>
          <h3 class="story-headline" id="storyHeadline"></h3><p class="story-meaning" id="glyphOriginalMeaning"></p>
          <div class="meaning-extension" id="glyphMeaningExtendBlock"><p id="glyphMeaningExtend"></p></div>
          <section class="structure-section" aria-labelledby="structureTitle"><h3 id="structureTitle">构形</h3><p class="structure-copy" id="structureDesc"></p><div class="component-list" id="componentList"></div></section>
          <section class="evolution-section" aria-labelledby="evolutionTitle"><h3 id="evolutionTitle">古今字形</h3><div class="evolution-list" id="evolutionList"></div></section>
          <details class="source-note"><summary>资料来源 <span aria-hidden="true">＋</span></summary><dl id="sourceDetails"></dl><p>笔段依项目拆分资料展示，构形与释读仍需人工校核。</p><p id="evolutionNote"></p><p id="storySource"></p><figure class="source-original"><img id="sourceOriginal" alt="" loading="lazy" /><figcaption>原始字形样本</figcaption></figure></details>
        </article>
      </section>
      <section class="relations-section" id="relations" aria-labelledby="relationTitle"><h2 class="panel-title" id="relationTitle">字间联系</h2><div id="relationsPanel"></div></section>
      <footer class="site-footer"><a href="./license.html" target="_blank" rel="noopener">授权说明 ↗</a></footer>
    </main>
  </div>
  <dialog id="catalogDialog" class="catalog-dialog" aria-labelledby="catalogTitle"><div class="dialog-heading"><h2 id="catalogTitle">字库 <span id="glyphCount">124</span></h2><button id="closeCatalog" type="button" class="icon-button" aria-label="关闭字库">×</button></div><label class="search-field"><input id="glyphSearch" type="search" placeholder="搜索字、部首或编号" aria-label="搜索字库" /></label><p class="catalog-result" id="catalogResult" aria-live="polite"></p><div class="glyph-list" id="glyphList"></div></dialog>
  <noscript><p class="noscript-note">请启用 JavaScript 查看字形。</p></noscript>
  <script src="./data/xiaozhuan-index.js"></script><script src="./src/render_xiaozhuan.js"></script><script src="./data/glyphs.js"></script><script src="./data/stories.js"></script><script src="./data/glyph-vectors.js"></script><script src="./data/seal-font.js"></script><script src="./data/cleaned-glyphs.js"></script><script src="./src/clean-glyph-shapes.js"></script><script src="./src/component-deriver.js"></script><script src="./src/relation-engine.js"></script><script src="./src/graph-renderer.js"></script><script src="./src/relations-panel.js"></script><script src="./src/ui.js"></script><script src="./src/app.js"></script>
</body>
</html>
